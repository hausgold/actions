name: Deploy to AWS/ECS

on:
  workflow_call:
    inputs:
      potpourri_target:
        description: The Potpourri target to run
        required: false
        default: ci/docker-app
        type: string
      potpourri_ref:
        description: The Potpourri branch or tag to run the targets from, a
          testing knob for a feature branch, refused on the default branch
        required: false
        default: master
        type: string
      base_path:
        description: The path to run all commands in, relative to the
          repository root
        required: false
        default: .
        type: string
      force_env:
        description: When given it overwrites the Potpourri configured
          `DEPLOY_ENV` environment variable
        required: false
        type: string
      timeout_minutes:
        description: Maximum time in minutes the workflow is allowed to run
        required: false
        default: 20
        type: number
      build_docs:
        description: Try to build the docs on production builds, or not
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    name: ECS
    runs-on: ubuntu-24.04
    timeout-minutes: '${{ inputs.timeout_minutes }}'
    steps:
      - name: Refuse a Potpourri branch on the default branch
        if: inputs.potpourri_ref != 'master' && github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::potpourri_ref is a testing knob, the default branch runs master"
          exit 1

      - name: Prepare the environment
        uses: hausgold/actions/ci@v2
        env:
          POTPOURRI_REF: '${{ inputs.potpourri_ref }}'
        with:
          clone_token: '${{ secrets.CLONE_TOKEN }}'
          settings_secret_key: '${{ secrets.SETTINGS_SECRET_KEY }}'
          settings: '${{ github.repository }}'
          target: '${{ inputs.potpourri_target }}'

      - name: Force deploy environment
        run:
          var ORIG_DEPLOY_ENV ${DEPLOY_ENV};
          var DEPLOY_ENV '${{ inputs.force_env }}'
        if: inputs.force_env != null

      - name: Deploy the application
        run: ecs-deployment deploy
        working-directory: '${{ inputs.base_path }}'

      - name: Run always post-deployment hooks
        run: ecs-deployment always-post-deploy-hooks
        working-directory: '${{ inputs.base_path }}'
        if: always()

      - name: Clean old application packages
        run: ecs-deployment clean
        working-directory: '${{ inputs.base_path }}'
        if: env.DEPLOY_ENV == 'production'

      # The helper reads the image SBOM the sbom job of the build uploads,
      # and that job runs next to the canary deployment, so the helper
      # waits for it. The job succeeds when this step fails: the
      # deployment is complete by then.
      - name: Upload the SBOM of the deployment
        run: dependency-track upload-deployment
        working-directory: '${{ inputs.base_path }}'
        continue-on-error: true

      - name: Restore deploy environment
        run: var DEPLOY_ENV ${ORIG_DEPLOY_ENV}
        if: inputs.force_env != null

      - name: Write a message to Slack
        run: slack

      - name: Create a Github Deployment
        run: deployment

      - name: Build and upload application documentation
        run: api-docs && coverage --docs-only
        if: inputs.build_docs == true && env.DEPLOY_ENV == 'production'
        env:
          WORKFLOW_DISPATCH_TOKEN: '${{ secrets.WORKFLOW_DISPATCH_TOKEN }}'
