name: Deploy to AWS/S3

on:
  workflow_call:
    inputs:
      potpourri_target:
        description: The Potpourri target to run
        required: false
        default: ci/docker-app
        type: string
      potpourri_ref:
        description: Run every Potpourri helper of this job, the deployment
          included, from this Potpourri branch. For testing from a branch of
          the caller; refused on the default branch and on tags.
        required: false
        default: master
        type: string
      base_path:
        description: The path to run all commands in, relative to the
          repository root
        required: false
        default: .
        type: string
      force_env:
        description: When given it overwrites the Potpourri configured
          `DEPLOY_ENV` environment variable
        required: false
        type: string
      setup_target:
        description: The GNU Make target(s) to setup the application
          for building
        required: false
        default: install
        type: string
      timeout_minutes:
        description: Maximum time in minutes the workflow is allowed to run
        required: false
        default: 20
        type: number
      sbom:
        description: Whether to record the completed deployment in
          Dependency-Track, in a job after it
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: S3
    runs-on: ubuntu-24.04
    timeout-minutes: '${{ inputs.timeout_minutes }}'
    outputs:
      # Written by Potpourri's s3-deployment deploy
      s3_bucket: '${{ steps.deploy.outputs.s3_bucket }}'
      dest_url: '${{ steps.deploy.outputs.dest_url }}'
    env:
      POTPOURRI_REF: '${{ inputs.potpourri_ref }}'
    steps:
      - name: Refuse a Potpourri branch on the default branch or a tag
        if: inputs.potpourri_ref != 'master' &&
          (github.ref_name == github.event.repository.default_branch ||
          github.ref_type == 'tag')
        run: |
          echo "::error::potpourri_ref is for testing from a branch, the default branch and tags run Potpourri master"
          exit 1

      - name: Prepare the environment
        uses: hausgold/actions/ci@v2
        with:
          clone_token: '${{ secrets.CLONE_TOKEN }}'
          settings_secret_key: '${{ secrets.SETTINGS_SECRET_KEY }}'
          settings: '${{ github.repository }}'
          target: '${{ inputs.potpourri_target }}'

      - name: Setup the application
        run: make '${{ inputs.setup_target }}'
        working-directory: '${{ inputs.base_path }}'

      - name: Force deploy environment
        run:
          var ORIG_DEPLOY_ENV ${DEPLOY_ENV};
          var DEPLOY_ENV '${{ inputs.force_env }}'
        if: inputs.force_env != null

      - name: Build the application package
        run: s3-deployment build
        working-directory: '${{ inputs.base_path }}'

      - name: Deploy the application
        id: deploy
        run: s3-deployment deploy
        working-directory: '${{ inputs.base_path }}'

      - name: Run always post-deployment hooks
        run: s3-deployment always-post-deploy-hooks
        working-directory: '${{ inputs.base_path }}'
        if: always()

      - name: Restore deploy environment
        run: var DEPLOY_ENV ${ORIG_DEPLOY_ENV}
        if: inputs.force_env != null

      - name: Write a message to Slack
        run: slack

      - name: Create a Github Deployment
        run: deployment

  # Records the deployment in Dependency-Track. A failed upload fails this
  # job and leaves the deployment as it is; the other uploads still run.
  sbom:
    name: SBOM
    needs: deploy
    if: inputs.sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POTPOURRI_REF: '${{ inputs.potpourri_ref }}'
    steps:
      - name: Prepare the environment
        uses: hausgold/actions/ci@v2
        with:
          clone_token: '${{ secrets.CLONE_TOKEN }}'
          settings_secret_key: '${{ secrets.SETTINGS_SECRET_KEY }}'
          settings: '${{ github.repository }}'
          target: '${{ inputs.potpourri_target }}'

      - name: Upload the source SBOM
        run: dependency-track upload-source --summary "${GITHUB_STEP_SUMMARY}"
        working-directory: '${{ inputs.base_path }}'
        timeout-minutes: 5

      - name: Upload the deployment SBOM
        if: '!cancelled()'
        run: dependency-track upload-deployment
          --summary "${GITHUB_STEP_SUMMARY}"
        working-directory: '${{ inputs.base_path }}'
        timeout-minutes: 5
        env:
          DEPLOY_ENV: '${{ inputs.force_env || env.DEPLOY_ENV }}'
          S3_BUCKET: '${{ needs.deploy.outputs.s3_bucket }}'
          DEST_URL: '${{ needs.deploy.outputs.dest_url }}'
