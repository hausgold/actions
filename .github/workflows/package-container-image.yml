name: Package Container Image

on:
  workflow_call:
    inputs:
      potpourri_target:
        description: The Potpourri target to run
        required: false
        default: ci/docker-app
        type: string
      potpourri_ref:
        description: Run every Potpourri helper of this job, the image build
          included, from this Potpourri branch. For testing from a branch of
          the caller; refused on the default branch and on tags.
        required: false
        default: master
        type: string
      # We focus on application which uses the shared
      # container image by default
      base_path:
        description: The container image build path, relative to the
          repository root
        required: false
        default: config/container
        type: string
      warm:
        description: Whether to warm up the built image before testing and
          publishing it (compiled assets and caches as an extra image layer,
          needs the shared application image)
        required: false
        default: false
        type: boolean
      publish:
        description: Whether to publish the image (AWS)
        required: false
        default: true
        type: boolean
      publish_prebuilt:
        description: Whether to publish a prebuilt image (Docker Hub)
        required: false
        default: true
        type: boolean
      timeout_minutes:
        description: Maximum time in minutes the workflow is allowed to run
        required: false
        default: 15
        type: number

jobs:
  package:
    name: Container Image
    runs-on: ubuntu-24.04
    timeout-minutes: '${{ inputs.timeout_minutes }}'
    env:
      POTPOURRI_REF: '${{ inputs.potpourri_ref }}'
    steps:
      - name: Refuse a Potpourri branch on the default branch or a tag
        if: inputs.potpourri_ref != 'master' &&
          (github.ref_name == github.event.repository.default_branch ||
          github.ref_type == 'tag')
        run: |
          echo "::error::potpourri_ref is for testing from a branch, the default branch and tags run Potpourri master"
          exit 1

      - name: Prepare the environment
        uses: hausgold/actions/ci@v2
        with:
          clone_token: '${{ secrets.CLONE_TOKEN }}'
          settings_secret_key: '${{ secrets.SETTINGS_SECRET_KEY }}'
          settings: '${{ github.repository }}'
          target: '${{ inputs.potpourri_target }}'

      - name: Build the container image
        run: make build
        working-directory: '${{ inputs.base_path }}'

      - name: Warm up the container image
        if: inputs.warm == true
        run: make warm
        working-directory: '${{ inputs.base_path }}'

      - name: Run the container image test suite
        run: make test
        working-directory: '${{ inputs.base_path }}'

      - name: Upload the container image (AWS)
        if: inputs.publish == true
        run: make publish
        working-directory: '${{ inputs.base_path }}'

      - name: Upload the container image (Docker Hub)
        if: inputs.publish_prebuilt == true
        run: make publish-prebuilt
        working-directory: '${{ inputs.base_path }}'

