name: Package Container Image

on:
  workflow_call:
    inputs:
      potpourri_target:
        description: The Potpourri target to run
        required: false
        default: ci/docker-app
        type: string
      potpourri_ref:
        description: The Potpourri branch or tag to run the targets from, a
          testing knob for a feature branch, refused on the default branch
        required: false
        default: master
        type: string
      # We focus on application which uses the shared
      # container image by default
      base_path:
        description: The container image build path, relative to the
          repository root
        required: false
        default: config/container
        type: string
      publish:
        description: Whether to publish the image (AWS)
        required: false
        default: true
        type: boolean
      publish_prebuilt:
        description: Whether to publish a prebuilt image (Docker Hub)
        required: false
        default: true
        type: boolean
      timeout_minutes:
        description: Maximum time in minutes the workflow is allowed to run
        required: false
        default: 15
        type: number
      dependency_track:
        description: Whether to upload the SBOM of the built image to
          Dependency-Track
        required: false
        default: false
        type: boolean

jobs:
  package:
    name: Container Image
    runs-on: ubuntu-24.04
    timeout-minutes: '${{ inputs.timeout_minutes }}'
    steps:
      - name: Refuse a Potpourri branch on the default branch
        if: inputs.potpourri_ref != 'master' && github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::potpourri_ref is a testing knob, the default branch runs master"
          exit 1

      - name: Prepare the environment
        uses: hausgold/actions/ci@v2
        env:
          POTPOURRI_REF: '${{ inputs.potpourri_ref }}'
        with:
          clone_token: '${{ secrets.CLONE_TOKEN }}'
          settings_secret_key: '${{ secrets.SETTINGS_SECRET_KEY }}'
          settings: '${{ github.repository }}'
          target: '${{ inputs.potpourri_target }}'

      - name: Build the container image
        run: make build
        working-directory: '${{ inputs.base_path }}'

      - name: Run the container image test suite
        run: make test
        working-directory: '${{ inputs.base_path }}'

      - name: Upload the container image (AWS)
        if: inputs.publish == true
        run: make publish
        working-directory: '${{ inputs.base_path }}'

      - name: Upload the container image (Docker Hub)
        if: inputs.publish_prebuilt == true
        run: make publish-prebuilt
        working-directory: '${{ inputs.base_path }}'

  # syft unpacks every layer of the image, which needs more room than the
  # runner has left after the build, so the scan runs on a runner of its own
  # and reads the pushed image back from a registry
  sbom:
    name: SBOM
    needs: package
    if: inputs.dependency_track == true && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare the environment
        uses: hausgold/actions/ci@v2
        env:
          POTPOURRI_REF: '${{ inputs.potpourri_ref }}'
        with:
          clone_token: '${{ secrets.CLONE_TOKEN }}'
          settings_secret_key: '${{ secrets.SETTINGS_SECRET_KEY }}'
          settings: '${{ github.repository }}'
          target: '${{ inputs.potpourri_target }}'

      - name: Upload the SBOM of the container image to Dependency-Track
        env:
          MIRROR: ${{ inputs.publish_prebuilt == true && format('hausgold/app:{0}', github.event.repository.name) || '' }}
        run: |
          dependency-track upload-image \
            "${AWS_ECR_REPO}${GITHUB_REPO}:${IMAGE_REF}" "${MIRROR}"
